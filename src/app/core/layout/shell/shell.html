<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/" aria-label="Accueil">
      <img class="shell__logo" src="icons/icon-72x72.png" width="36" height="36" alt="" />
      <span class="shell__title">{{ appName }}</span>
    </a>

    <nav class="shell__nav" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
        >Accueil</a
      >
      @if (isAuthenticated()) {
        <a
          routerLink="/gallery"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Mes œuvres</a
        >
        <a routerLink="/gallery/publish" routerLinkActive="is-active">Publier</a>
      } @else {
        <a routerLink="/gallery" routerLinkActive="is-active">Galerie</a>
      }
      @if (isStaff()) {
        <div class="shell__dropdown" [class.is-open]="adminMenuOpen()">
          <button
            type="button"
            class="shell__dropdown-trigger"
            [class.is-active]="adminMenuOpen()"
            [attr.aria-expanded]="adminMenuOpen()"
            aria-haspopup="true"
            (click)="toggleAdminMenu($event)"
          >
            Admin
          </button>
          @if (adminMenuOpen()) {
            <div
              class="shell__dropdown-panel"
              role="menu"
              aria-label="Menu Admin"
              (click)="onAdminPanelClick($event)"
            >
              <a
                role="menuitem"
                routerLink="/admin/accounts"
                routerLinkActive="is-active"
                (click)="closeAdminMenu()"
                >Comptes</a
              >
              <a
                role="menuitem"
                routerLink="/admin/moderation"
                routerLinkActive="is-active"
                (click)="closeAdminMenu()"
                >Modération</a
              >
            </div>
          }
        </div>
      }
      @if (isAuthenticated()) {
        <a routerLink="/auth" class="shell__user-link" routerLinkActive="is-active"
          >{{ pseudo() }}</a
        >
        <button class="shell__logout" type="button" (click)="onSignOut()">
          Se déconnecter
        </button>
      } @else {
        <a routerLink="/auth" routerLinkActive="is-active">Compte</a>
      }
    </nav>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
